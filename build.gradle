plugins {
    id 'java'
    id 'application'
}

group = 'it.unicam.cs.mpgc'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

// i sorgenti sono in UTF-8: lo diciamo al compilatore, così non dipende dal computer
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

application {
    mainClass = 'it.unicam.cs.mpgc.rpg130402.Main'
}

// vale per ogni avvio del gioco: ./gradlew run e anche il task che IntelliJ crea col triangolo verde.
// L'output passa da Gradle, che lo legge in UTF-8: il programma deve scriverlo in UTF-8
tasks.withType(JavaExec).configureEach {
    standardInput = System.in
    jvmArgs '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}