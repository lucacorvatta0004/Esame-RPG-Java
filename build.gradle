plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'it.unicam.cs.mpgc'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// la GUI: controls per pulsanti, caselle e tendine (porta con sé graphics), fxml per le schermate scritte in FXML
javafx {
    version = "25.0.3"
    modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {
    implementation 'com.google.code.gson:gson:2.13.2'
    testImplementation platform('org.junit:junit-bom:6.0.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // con Gradle 9 il launcher della JUnit Platform va dichiarato: serve solo per eseguire i test
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// i sorgenti sono in UTF-8: lo diciamo al compilatore, così non dipende dal computer
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

application {
    mainClass = 'it.unicam.cs.mpgc.rpg130402.Main'
}

// vale per ogni avvio del gioco: ./gradlew run e anche il task che IntelliJ crea col triangolo verde.
// L'output passa da Gradle, che lo legge in UTF-8: il programma deve scriverlo in UTF-8
tasks.withType(JavaExec).configureEach {
    standardInput = System.in
    jvmArgs '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}